name: KAXMOK Chat Retry Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pillow pytchat
      - name: Check Python syntax
        run: python -m py_compile chat_stream.py chat_race.py leaderboard.py
      - name: Verify retry logic without connecting to YouTube or starting a stream
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path("chat_stream.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          listener = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == "listen_to_chat"
          )
          listener_source = ast.get_source_segment(source, listener)
          assert "while not stop_event.is_set()" in listener_source
          assert "stop_event.wait(15)" in listener_source
          assert "Will retry in 15 seconds" in listener_source
          assert "chat_race.handle_command(author, message)" in listener_source
          print("PASS: chat retry loop is present; no live stream or YouTube connection started")
          PY
