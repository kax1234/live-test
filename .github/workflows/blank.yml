name: KAXMOK Live Songs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    name: Stream KAXMOK to YouTube
    runs-on: ubuntu-latest
    environment: YT_STREAM_KEY
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python chat dependencies
        run: |
          python3 -m pip install --upgrade google-api-python-client google-auth pillow

      - name: Validate files and secret
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YT_STREAM_KEY" || {
            echo "YT_STREAM_KEY is empty. Check the environment secret."
            exit 1
          }
          test -f background.jpg
          test -f blue.jpg
          test -f pink.jpg
          test -f rain.jpg
          test -f lofi.jpg
          test -f chat_stream.py
          test -f leaderboard.py
          test -f quiz_game.py
          test -d songs
          find songs -type f -iname '*.mp3' | grep -q .
          python3 -m py_compile chat_stream.py leaderboard.py quiz_game.py
          echo "Images, scripts, quiz game, songs, and stream secret validated."

      - name: Create playlist
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          songs = sorted(
              p.resolve()
              for p in Path("songs").rglob("*")
              if p.is_file() and p.suffix.lower() == ".mp3"
          )

          if not songs:
              raise SystemExit("No MP3 files found")

          with open("/tmp/playlist.txt", "w", encoding="utf-8") as f:
              for p in songs:
                  s = str(p)
                  if "'" in s or "\n" in s:
                      raise SystemExit(
                          f"Rename filename containing apostrophe/newline: {p.name}"
                      )
                  f.write(f"file '{s}'\n")

          print(f"Playlist ready: {len(songs)} tracks")
          PY

      - name: Combine songs
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning \
            -f concat -safe 0 -i /tmp/playlist.txt \
            -vn -c:a libmp3lame -q:a 4 \
            /tmp/combined.mp3
          test -s /tmp/combined.mp3
          echo "Combined audio file created."

      - name: Start YouTube livestream with chat-controlled backgrounds
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          YT_VIDEO_ID: ${{ vars.YT_VIDEO_ID }}
          YT_CHAT_TOKEN_JSON: ${{ secrets.YT_CHAT_TOKEN_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python3 chat_stream.py
