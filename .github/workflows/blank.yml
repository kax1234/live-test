name: KAXMOK Live Songs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    name: Stream KAXMOK to YouTube
    runs-on: ubuntu-latest
    environment: YT_STREAM_KEY
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Node.js for YouTube live chat
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Python and chat dependencies
        run: |
          python3 -m pip install --upgrade pillow
          npm install --no-save youtubei.js
      - name: Validate files and secrets
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_RUNNER_TOKEN: ${{ secrets.CONTROL_RUNNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YT_STREAM_KEY" || { echo "YT_STREAM_KEY is empty"; exit 1; }
          test -f background.jpg
          test -f blue.jpg
          test -f pink.jpg
          test -f rain.jpg
          test -f lofi.jpg
          test -f chat_stream.py
          test -f leaderboard.py
          test -d songs
          find songs -type f -iname '*.mp3' | grep -q .
          python3 -m py_compile chat_stream.py leaderboard.py
          if [ -n "$CONTROL_API_URL" ] && [ -n "$CONTROL_RUNNER_TOKEN" ]; then
            echo "Remote song controls enabled."
          else
            echo "Remote controls not configured; stream will run without remote panel."
          fi
      - name: Start YouTube livestream with song controls
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
          YT_VIDEO_ID: ${{ vars.YT_VIDEO_ID }}
          CONTROL_API_URL: ${{ secrets.CONTROL_API_URL }}
          CONTROL_RUNNER_TOKEN: ${{ secrets.CONTROL_RUNNER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 chat_stream.py
