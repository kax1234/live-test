name: WOS Room Preview (No Livestream)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --upgrade playwright
          python3 -m playwright install --with-deps chromium
      - name: Capture WOS room preview
        env:
          WOS_ROOM_URL: https://wos.gg/r/9a756300-c6f7-4469-a6e2-f2615b367e59
        run: python3 wos_preview.py
      - name: Upload preview image
        uses: actions/upload-artifact@v4
        with:
          name: kaxmok-wos-preview
          path: artifacts/wos-preview.jpg
          if-no-files-found: error
          retention-days: 3
