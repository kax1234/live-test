<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAXMOK Song Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f4f7ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(540px,100%)}.brand{color:#70e8f3;letter-spacing:.2em;font-size:12px;font-weight:800}h1{margin:10px 0}.muted{color:#91a0b8;font-size:13px}.card{background:#111a29;border:1px solid #263247;border-radius:18px;padding:20px;margin:14px 0}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #34445e;background:#0b111d;color:white;font:inherit;margin-top:8px}button{cursor:pointer;font-weight:700;background:#172235}button.main{background:linear-gradient(100deg,#5cdce9,#a8a1ff);color:#07111b;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status{min-height:22px;color:#70e8f3;font-size:13px;margin-top:10px}label{display:block;margin-top:10px}.small{font-size:12px;color:#aebbd0;line-height:1.6}</style><main>
<div class="brand">KAXMOK / PRIVATE STUDIO</div><h1>Song Control</h1><p class="muted">Remote controls for your live audio.</p>
<section class="card"><label>Worker URL<input id="url" placeholder="https://your-worker.workers.dev"></label><label>Panel password<input id="pw" type="password" placeholder="Your PANEL_PASSWORD"></label><button class="main" id="connect">Connect securely</button><div class="status" id="status">Not connected</div></section>
<section class="card"><div class="grid"><button data-action="previous">↶ Previous</button><button data-action="next">↠ Next song</button><button data-action="pause">Ⅱ Pause</button><button data-action="resume">▶ Resume</button></div><label>Volume <b id="v">80%</b><input id="vol" type="range" min="0" max="100" value="80"></label><button id="setvol">Apply volume</button><label>Choose song filename<input id="song" placeholder="example.mp3"></label><button class="main" id="choose">Play selected song</button></section>
<p class="small">Uses HTTPS and a separate panel password. Never enter your YouTube stream key. This panel only works when the streaming runner has the control-polling integration enabled.</p></main>
<script>
const $=id=>document.getElementById(id);let connected=false;
function cfg(){return {base:$('url').value.trim().replace(/\/$/,''),password:$('pw').value}}
async function api(path,body){const c=cfg();if(!c.base||!c.password)throw Error('Enter Worker URL and panel password.');const r=await fetch(c.base+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+c.password,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function msg(s){$('status').textContent=s}
$('vol').oninput=()=> $('v').textContent=$('vol').value+'%';
$('connect').onclick=async()=>{try{const d=await api('/api/status');connected=true;msg('Connected. Runner status: '+JSON.stringify(d.status||'waiting'));}catch(e){msg(e.message)}};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{await api('/api/command',{action:b.dataset.action});msg('Command queued: '+b.dataset.action+'.');}catch(e){msg(e.message)}});
$('setvol').onclick=async()=>{try{await api('/api/command',{action:'volume',value:Number($('vol').value)});msg('Volume command queued.')}catch(e){msg(e.message)}};
$('choose').onclick=async()=>{try{if(!$('song').value.trim())throw Error('Enter an exact MP3 filename.');await api('/api/command',{action:'choose',song:$('song').value.trim()});msg('Song command queued.')}catch(e){msg(e.message)}};
</script></html>
