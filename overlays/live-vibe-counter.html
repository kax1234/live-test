<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAXMOK Live Vibe</title>
<style>
:root{color-scheme:dark;--glow:#79f7ff;--violet:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7fbff;display:grid;place-items:center}
.widget{width:min(620px,96vw);padding:24px 28px 22px;border:1px solid #b5f8ff2b;border-radius:24px;background:linear-gradient(135deg,#07111edb,#17102be0);box-shadow:0 0 42px #64eaff16,inset 0 1px #ffffff14;position:relative;overflow:hidden}
.widget:before{content:"";position:absolute;inset:-80% -30%;background:conic-gradient(from 90deg,transparent,#6cecf21c,transparent,#a78bfa19,transparent);animation:spin 18s linear infinite;pointer-events:none}
.content{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:12px;letter-spacing:.25em;font-weight:800;color:#c8faff}
.live{font-size:10px;letter-spacing:.16em;font-weight:800;color:#ffb7c7;display:flex;align-items:center;gap:7px}
.dot{height:7px;width:7px;background:#ff5379;border-radius:50%;box-shadow:0 0 12px #ff5379;animation:pulse 1.7s ease-in-out infinite}
.label{margin-top:20px;color:#a8b8d4;font-size:12px;letter-spacing:.22em;font-weight:700}
.scoreline{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.score{font-size:clamp(64px,11vw,94px);line-height:1.02;font-weight:850;letter-spacing:-.07em;background:linear-gradient(100deg,#fff,#a8f8ff 55%,#c4a9ff);color:transparent;background-clip:text;-webkit-background-clip:text;font-variant-numeric:tabular-nums}
.outof{font-size:15px;color:#a9bad6}
.status{font-size:14px;color:#d9e9ff;font-weight:650}
.track{height:8px;background:#ffffff12;border-radius:99px;margin-top:18px;overflow:hidden;border:1px solid #ffffff0b}
.fill{height:100%;width:72%;border-radius:99px;background:linear-gradient(90deg,#55e7ef,#8ba8ff,#c09bff);box-shadow:0 0 18px #72efff77;transition:width 1.8s cubic-bezier(.2,.8,.2,1)}
.bottom{display:flex;justify-content:space-between;gap:10px;margin-top:13px;color:#9eafcb;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.equalizer{display:flex;gap:3px;align-items:center;height:14px}
.equalizer i{display:block;width:3px;border-radius:4px;background:#7bf1f4;animation:bar .8s ease-in-out infinite alternate}
.equalizer i:nth-child(1){height:5px}.equalizer i:nth-child(2){height:12px;animation-delay:.15s}.equalizer i:nth-child(3){height:8px;animation-delay:.3s}.equalizer i:nth-child(4){height:14px;animation-delay:.08s}.equalizer i:nth-child(5){height:6px;animation-delay:.25s}
@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}
@keyframes bar{to{transform:scaleY(.4);opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="widget" aria-label="KAXMOK ambient live vibe meter">
<div class="content">
<div class="top"><div class="brand">KAXMOK <span style="color:#7debf3">/ RADIO</span></div><div class="live"><span class="dot"></span> LIVE SESSION</div></div>
<div class="label">THE VIBE METER</div>
<div class="scoreline"><div class="score" id="score">78</div><div class="outof">/ 100</div></div>
<div class="status" id="status">Late-night flow</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="bottom"><span>Malayalam · Tamil · Hindi · English · Lo-fi</span><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
</div>
</section>
<script>
/* Visual-only ambient animation: no network, chat, API, cookies, or tracking.
   This is an aesthetic meter, not a measurement of viewers or engagement. */
(() => {
 const score = document.getElementById('score');
 const fill = document.getElementById('fill');
 const status = document.getElementById('status');
 const moods = [[0,35,'Soft focus'],[36,54,'Easy listening'],[55,72,'In the zone'],[73,88,'Late-night flow'],[89,100,'Full vibe']];
 let value = 78;
 function tick(){
   value = Math.max(28, Math.min(96, value + (Math.random() * 10 - 5)));
   const shown = Math.round(value);
   score.textContent = shown;
   fill.style.width = shown + '%';
   status.textContent = moods.find(m => shown >= m[0] && shown <= m[1])[2];
 }
 setInterval(tick, 2600);
})();
</script>
</body>
</html>
