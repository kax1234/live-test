<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAXMOK Vibe Map</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: Arial, sans-serif; color: #eaf1ff; }
  #map { position: absolute; inset: 0; overflow: hidden; }
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #9ecbff; box-shadow: 0 0 7px 2px #4e8dff66; opacity: .75; }
  .link { position: absolute; height: 1px; transform-origin: 0 50%; background: #6ca8ff; opacity: .22; }
  #brand { position: absolute; left: 4%; bottom: 6%; letter-spacing: .2em; font-size: clamp(12px, 1.5vw, 20px); font-weight: 700; text-shadow: 0 0 12px #498dff88; }
  #sub { margin-top: 6px; font-size: clamp(8px, .8vw, 12px); letter-spacing: .16em; color: #9fb5dc; font-weight: 400; }
  #status { position: absolute; right: 4%; bottom: 6%; font-size: clamp(9px, .9vw, 12px); color: #a9c1ec; letter-spacing: .12em; }
</style>
</head>
<body>
<div id="map" aria-hidden="true"></div>
<div id="brand">KAXMOK<div id="sub">YOUR CHAT. YOUR CONSTELLATION.</div></div>
<div id="status">VIBE MAP · READY</div>
<script>
(() => {
  'use strict';
  const map = document.getElementById('map');
  const status = document.getElementById('status');
  const stars = [];
  const MAX_STARS = 42;
  // Create a fixed, tiny star field once; no canvas, external libraries, or animation loop.
  for (let i = 0; i < MAX_STARS; i++) {
    const el = document.createElement('i');
    el.className = 'star';
    const star = { el, x: 8 + Math.random() * 84, y: 8 + Math.random() * 76 };
    el.style.left = star.x + '%';
    el.style.top = star.y + '%';
    map.appendChild(el);
    stars.push(star);
  }
  let active = 0;
  let lastMessageAt = 0;
  function reactToChat(payload) {
    const now = Date.now();
    if (now - lastMessageAt < 250) return; // cap visual updates
    lastMessageAt = now;
    active++;
    const star = stars[(active - 1) % stars.length];
    star.el.style.width = '5px';
    star.el.style.height = '5px';
    star.el.style.opacity = '1';
    star.el.style.boxShadow = '0 0 10px 3px #72aaff99';
    status.textContent = 'VIBE MAP · ' + active + ' CHAT REACTIONS';
    // Restore the dot after a short highlight; no continuous animation.
    window.setTimeout(() => {
      star.el.style.width = '3px';
      star.el.style.height = '3px';
      star.el.style.opacity = '.75';
      star.el.style.boxShadow = '0 0 7px 2px #4e8dff66';
    }, 900);
  }
  // Integration point: send {type:'chat_message', text:'...'} to this window.
  window.addEventListener('message', event => {
    const data = event.data;
    if (data && (data.type === 'chat_message' || data.event === 'chat_message')) reactToChat(data);
  });
  // Respect reduced-motion preferences; this overlay intentionally has no continuous motion.
})();
</script>
</body>
</html>
